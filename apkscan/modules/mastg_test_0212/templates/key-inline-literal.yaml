id: mastg-0212-key-inline-literal

info:
  name: SecretKeySpec creada directamente con un literal
  author: apkscan
  severity: high
  description: SecretKeySpec recibe un string con getBytes() o un arreglo de bytes escrito en la misma llamada.
  tags: android,crypto,mastg-test-0212

file:
  - extensions:
      - java
      - kt
    matchers:
      - type: regex
        regex:
          - 'new\s+SecretKeySpec\(\s*"[^"]+"\.getBytes\([^)]*\)\s*,\s*[^)]*\)'
          - 'new\s+SecretKeySpec\(\s*new\s+byte\[\]\s*\{[^}]*\}\s*,\s*[^)]*\)'
    extractors:
      - type: regex
        regex:
          - 'new\s+SecretKeySpec\(\s*"[^"]+"\.getBytes\([^)]*\)\s*,\s*[^)]*\)'
          - 'new\s+SecretKeySpec\(\s*new\s+byte\[\]\s*\{[^}]*\}\s*,\s*[^)]*\)'
